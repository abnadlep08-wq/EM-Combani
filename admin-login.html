<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EM COMBANI | دخول المدير</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --primary: #1a2b3c;
            --secondary: #e6b800;
            --gold: #e6b800;
            --dark: #0f1a24;
            --white: #ffffff;
            --gray: #2c3e50;
            --light-bg: #f8f9fa;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-gold: 0 5px 20px rgba(230,184,0,0.3);
        }

        body {
            background: linear-gradient(135deg, var(--primary), #0a0f15);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(230,184,0,0.1) 0%, transparent 50%);
            animation: moveBg 20s infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 80%, rgba(230,184,0,0.1) 0%, transparent 50%);
            animation: moveBg 15s infinite alternate-reverse;
        }

        @keyframes moveBg {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .login-container {
            background: rgba(26, 43, 60, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow-gold);
            width: 90%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(230,184,0,0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header i {
            font-size: 4rem;
            color: var(--secondary);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px var(--secondary);
        }

        .login-header h1 {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(230,184,0,0.3);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary);
            background: rgba(255,255,255,0.15);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--secondary);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }

        .error-message {
            background: rgba(255,0,0,0.2);
            color: #ff6b6b;
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #ff6b6b;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #ccc;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: var(--secondary);
        }

        .back-link i {
            margin-left: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-crown"></i>
            <h1>دخول المدير</h1>
            <p>الرجاء إدخال بيانات الدخول للوصول للوحة التحكم</p>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> اسم المستخدم أو كلمة المرور غير صحيحة
        </div>

        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-user"></i> اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> دخول
            </button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-right"></i> العودة للصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        function getAdminCredentials() {
            const saved = localStorage.getItem('admin_credentials');
            if (saved) {
                return JSON.parse(saved);
            }
            return { username: 'admin', password: 'admin123' };
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const credentials = getAdminCredentials();
            
            if (username === credentials.username && password === credentials.password) {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                
                setTimeout(() => {
                    document.getElementById('errorMessage').style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
